version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: petstore_postgres

    environment:
      POSTGRES_DB: petstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true

      - type: bind
        source: ./init
        target: /docker-entrypoint-initdb.d
        read_only: true

      - petstore_pgdata:/var/lib/postgresql/data

volumes:
  petstore_pgdata: